name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  icons:
    name: Check, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run test:types
      - run: npm run test:pack
      - name: README is up to date
        run: npm run readme && git diff --exit-code README.md

  examples:
    name: Next.js and Astro examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run test:examples

  site:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci && npm run build
      - working-directory: site
        run: npm ci && npm run sync && npm run check && npm run build
      - working-directory: site
        run: npx playwright install --with-deps chromium && npm test
