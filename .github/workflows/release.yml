name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      - run: npm run test:types
      - run: npm run test:pack
      - name: Pack
        run: npm pack
      # The built package is attached to the GitHub release, so it can be installed without npm:
      # npm install https://github.com/yash-ceo-ai/plume-icons/releases/download/vX.Y.Z/plume-icons-X.Y.Z.tgz
      - name: GitHub release with the package attached
        run: gh release create "$GITHUB_REF_NAME" plume-icons-*.tgz --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md. Install: npm install https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/plume-icons-${GITHUB_REF_NAME#v}.tgz" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to npm (when the NPM_TOKEN secret is set)
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
